<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — David Ly</title>
    <meta name="description" content="This page could not be found on davidly.ca." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="hero shell" style="grid-template-columns: 1fr">
      <div class="hero-copy">
        <p class="eyebrow">Error 404</p>
        <h1>This page wandered off.</h1>
        <p class="lede">
          The address you followed doesn&rsquo;t exist &mdash; it may have moved or never been here
          at all.
        </p>
        <div class="hero-actions">
          <a class="button button-primary" href="/">Back to home</a>
          <a class="button" href="/#projects">See projects</a>
        </div>
      </div>
    </main>
  </body>
</html>
